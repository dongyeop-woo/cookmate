name: 매일 블로그 자동 발행

on:
  # 매일 자동 발행. 2026-07-04 ~ 09-04 두 달 공백을 겪고 재개.
  # 수동 운영은 "말해야 돌아가는" 구조라 결국 끊김 — 비용(약 52원/편)보다
  # 공백의 손해가 훨씬 컸음.
  schedule:
    # 크론은 "이 시각 이후에 돈다"는 뜻일 뿐 시작 시각을 보장하지 않는다.
    # 실제 지연: 09-24 12분, 09-26 2시간, 09-22·23·25 약 4시간.
    # 그래서 발행 시각을 크론에 맡기지 않는다. 넉넉히 일찍 깨워서 글을 만들어
    # 두고, 아래 "발행 시각까지 대기" 단계에서 09:40 KST 에 맞춰 푸시한다.
    # (public 저장소라 Actions 분이 무제한이므로 대기 비용이 없다)
    - cron: '40 20 * * *' # 20:40 UTC = 05:40 KST — 목표까지 4시간 여유
  workflow_dispatch: # 수동 실행 (Actions 탭에서 "Run workflow")

permissions:
  contents: write
  issues: write # 실패 시 이슈 생성

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Node 셋업
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm ci --no-audit --no-fund

      - name: 블로그 글 생성 (Claude API)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/gen-blog-post.mjs

      # 글은 이미 만들어졌고, 여기서 시각만 맞춘다. 러너 배정이 늦어
      # 이미 목표를 지났으면 기다리지 않고 바로 내보낸다.
      - name: 발행 시각(09:40 KST)까지 대기
        run: |
          NOW=$(date -u +%s)
          if [ "$(date -u +%H)" -ge 12 ]; then
            TARGET=$(date -u -d 'tomorrow 00:40' +%s)   # 저녁(UTC)에 시작 → 다음 자정 뒤
          else
            TARGET=$(date -u -d 'today 00:40' +%s)      # 이미 자정을 넘겨 시작
          fi
          WAIT=$(( TARGET - NOW ))
          [ "$WAIT" -lt 0 ] && WAIT=0
          [ "$WAIT" -gt 15300 ] && WAIT=15300           # 잡 6시간 제한 안쪽으로
          echo "지금 $(date -u '+%F %T') UTC — ${WAIT}초 대기 후 발행"
          sleep "$WAIT"

      - name: 변경사항 커밋 + 푸시
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/content/blog/ web/lib/blog-index.ts
          if git diff --staged --quiet; then
            echo "변경사항 없음 (스크립트가 글 생성 못한 듯)"
            exit 1
          fi
          # 글 파일명과 같은 KST 기준으로 맞춘다 (UTC 로 쓰면 하루 어긋난다)
          DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          git commit -m "blog: 자동 발행 ${DATE}"
          git push

      # 메일만으로는 놓친다 — 2026-09-04~19 사이 16회 연속 실패를 아무도 못 봤음.
      # 이슈는 레포에 남고 해결 전까지 사라지지 않는다.
      - name: 실패 시 이슈 생성
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `매거진 자동 발행 실패 — ${today}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'blog-automation',
            });
            if (open.length > 0) {
              // 이미 열린 실패 이슈가 있으면 댓글만 — 매일 새 이슈가 쌓이지 않게
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number,
                body: `${today} 실행도 실패했습니다. [로그](${url})`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              body: [
                '매일 블로그 자동 발행이 실패했습니다.',
                '',
                `- [실행 로그](${url})`,
                '- 실패가 이어지는 동안 이 이슈에 댓글이 쌓입니다.',
                '- 고친 뒤 이 이슈를 닫아주세요 (닫아야 다음 실패 때 새 이슈가 열립니다).',
              ].join('\n'),
              labels: ['blog-automation'],
            });
