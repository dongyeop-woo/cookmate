name: 매일 블로그 자동 발행

on:
  # 매일 자동 발행. 2026-07-04 ~ 09-04 두 달 공백을 겪고 재개.
  # 수동 운영은 "말해야 돌아가는" 구조라 결국 끊김 — 비용(약 52원/편)보다
  # 공백의 손해가 훨씬 컸음.
  schedule:
    # 정각(0분)은 전 세계 워크플로가 몰려 무료 러너 배정이 밀린다. 실제로
    # 09-20~23 모두 00:00 UTC 지정인데 03:52~03:59 UTC(약 4시간 지연)에 돌았다.
    # 어중간한 분으로 옮기면 경합이 줄어 몇 분 안에 잡힌다.
    - cron: '47 23 * * *' # 매일 23:47 UTC = 08:47 KST (지연 감안해 09시 도착)
  workflow_dispatch: # 수동 실행 (Actions 탭에서 "Run workflow")

permissions:
  contents: write
  issues: write # 실패 시 이슈 생성

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Node 셋업
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm ci --no-audit --no-fund

      - name: 블로그 글 생성 (Claude API)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/gen-blog-post.mjs

      - name: 변경사항 커밋 + 푸시
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/content/blog/ web/lib/blog-index.ts
          if git diff --staged --quiet; then
            echo "변경사항 없음 (스크립트가 글 생성 못한 듯)"
            exit 1
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "blog: 자동 발행 ${DATE}"
          git push

      # 메일만으로는 놓친다 — 2026-09-04~19 사이 16회 연속 실패를 아무도 못 봤음.
      # 이슈는 레포에 남고 해결 전까지 사라지지 않는다.
      - name: 실패 시 이슈 생성
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `매거진 자동 발행 실패 — ${today}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'blog-automation',
            });
            if (open.length > 0) {
              // 이미 열린 실패 이슈가 있으면 댓글만 — 매일 새 이슈가 쌓이지 않게
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number,
                body: `${today} 실행도 실패했습니다. [로그](${url})`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              body: [
                '매일 블로그 자동 발행이 실패했습니다.',
                '',
                `- [실행 로그](${url})`,
                '- 실패가 이어지는 동안 이 이슈에 댓글이 쌓입니다.',
                '- 고친 뒤 이 이슈를 닫아주세요 (닫아야 다음 실패 때 새 이슈가 열립니다).',
              ].join('\n'),
              labels: ['blog-automation'],
            });
